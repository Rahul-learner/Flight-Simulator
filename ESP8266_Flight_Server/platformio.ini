[platformio]
src_dir = .

[env:nodemcu]
platform = espressif8266
board = nodemcu
framework = arduino
upload_port = /dev/ttyUSB0
upload_speed = 460800
monitor_speed = 115200
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.ldscript = eagle.flash.4m2m.ld

lib_deps =
    links2004/WebSockets @ ^2.4.1
